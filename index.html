            cursor: pointer;
            transition: all 0.3s;
        }

        .recharge-option:hover {
            border-color: #d2691e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(210, 105, 30, 0.2);
        }

        .recharge-option.selected {
            border-color: #d2691e;
            background: rgba(255, 215, 0, 0.1);
        }

        .recharge-rice {
            font-size: 20px;
            font-weight: bold;
            color: #d2691e;
        }

        .recharge-price {
            font-size: 14px;
            color: #cd853f;
            margin-top: 4px;
        }

        /* 位置设置 */
        .location-section {
            margin-bottom: 15px;
        }

        .locate-btn {
            width: 100%;
            padding: 12px;
            background: rgba(39, 174, 96, 0.1);
            border: 2px solid rgba(39, 174, 96, 0.3);
            border-radius: 12px;
            color: #27ae60;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .locate-btn:hover {
            background: rgba(39, 174, 96, 0.2);
        }

        .locate-btn.loading {
            animation: pulse 1s ease-in-out infinite;
        }

        .location-coords {
            font-size: 12px;
            color: #cd853f;
            padding: 10px;
            background: rgba(210, 105, 30, 0.05);
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(139, 69, 19, 0.92);
            color: white;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 3000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 装饰云朵 */
        .cloud {
            position: fixed;
            font-size: 40px;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        .cloud:nth-child(1) { top: 15%; left: 5%; animation: floatCloud 20s linear infinite; }
        .cloud:nth-child(2) { top: 30%; right: 8%; animation: floatCloud 25s linear infinite reverse; }
        .cloud:nth-child(3) { top: 60%; left: 15%; animation: floatCloud 30s linear infinite; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            50% { transform: translateX(30px); }
            100% { transform: translateX(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰云朵 -->
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>

    <!-- ===== 登录/注册页面 ===== -->
    <div class="auth-page" id="authPage">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="auth-logo-icon">🕊️</span>
                <div class="auth-logo-text">飞鸽传书</div>
                <div class="auth-slogan">让鸟儿传递你的心意</div>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
                <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
            </div>

            <!-- 登录表单 -->
            <div class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" id="loginPhone" placeholder="请输入手机号" maxlength="11">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码">
                </div>
                <button class="auth-btn" onclick="doLogin()">登 录</button>
                <div class="auth-switch">
                    还没有账号？<a onclick="switchAuthTab('register')">立即注册</a>
                </div>
            </div>

            <!-- 注册表单 -->
            <div class="auth-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" id="registerPhone" placeholder="请输入手机号" maxlength="11">
                    <div class="form-hint">手机号将作为您的账号，用于登录和添加好友</div>
                </div>
                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" class="form-input" id="registerNickname" placeholder="给自己起个名字吧" maxlength="12">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="请设置密码（至少6位）">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-input" id="registerPassword2" placeholder="请再次输入密码">
                </div>
                <button class="auth-btn" onclick="doRegister()">注 册</button>
                <div class="auth-switch">
                    已有账号？<a onclick="switchAuthTab('login')">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div class="app-container hidden" id="appContainer">
        <!-- 左侧好友列表 -->
        <div class="sidebar">
            <div class="sidebar-header" onclick="showProfileModal()">
                <div class="sidebar-avatar" id="sidebarAvatar">👤</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-nickname" id="sidebarNickname">用户</div>
                    <div class="sidebar-phone" id="sidebarPhone">138****8888</div>
                </div>
                <div class="sidebar-rice" id="sidebarRice">🌾 0</div>
            </div>

            <div class="sidebar-search">
                <input type="text" class="search-input" id="friendSearch" placeholder="搜索好友..." oninput="filterFriends()">
                <button class="add-friend-btn" onclick="showAddFriendModal()">
                    ➕ 添加好友
                </button>
            </div>

            <div class="friend-list" id="friendList">
                <!-- 好友列表由JS生成 -->
            </div>
        </div>

        <!-- 右侧聊天区 -->
        <div class="chat-area" id="chatArea">
            <!-- 空状态 -->
            <div class="empty-chat" id="emptyChat">
                <div class="empty-chat-icon">🕊️</div>
                <div class="empty-chat-text">选择一位好友开始传书</div>
                <div class="empty-chat-sub">让鸟儿为你传递心意</div>
            </div>

            <!-- 聊天头部 -->
            <div class="chat-header hidden" id="chatHeader">
                <div class="chat-header-avatar" id="chatAvatar">👩</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chatName">好友</div>
                    <div class="chat-header-location">
                        📍 <span id="chatLocation">未知位置</span>
                        <span class="chat-distance" id="chatDistance">-- km</span>
                    </div>
                    <div class="chat-bird-info" id="chatBirdInfo">选择信鸟查看飞行时间</div>
                </div>
                <button class="locate-btn" style="width: auto; padding: 8px 15px; margin: 0;" onclick="refreshDistance()">
                    🔄 更新距离
                </button>
            </div>

            <!-- 消息区 -->
            <div class="chat-messages hidden" id="chatMessages">
                <!-- 消息由JS生成 -->
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area hidden" id="chatInputArea">
                <div class="input-options">
                    <select class="bird-select" id="birdSelect" onchange="updateBirdInfo()">
                        <option value="pigeon">🕊️ 鸽子 - 60km/h</option>
                        <option value="falcon">🦅 游隼 - 320km/h</option>
                        <option value="swallow">🐦 燕子 - 110km/h</option>
                        <option value="goose">🦢 大雁 - 80km/h</option>
                        <option value="owl">🦉 猫头鹰 - 65km/h</option>
                        <option value="sparrow">🐤 麻雀 - 50km/h</option>
                    </select>
                    <div class="cost-display" id="costDisplay">10 米粒</div>
                </div>
                <textarea class="message-textarea" id="messageInput" placeholder="写下你想传递的话语...（Enter发送）"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    🕊️ 放飞信鸟
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 添加好友模态框 ===== -->
    <div class="modal" id="addFriendModal">
        <div class="modal-content">
            <div class="modal-title">
                ➕ 添加好友
            </div>
            <div class="form-group">
                <label class="form-label">对方手机号</label>
                <input type="tel" class="form-input" id="addFriendPhone" placeholder="请输入好友的手机号" maxlength="11">
            </div>
            <div id="searchResultArea">
                <!-- 搜索结果 -->
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="hideAddFriendModal()">取消</button>
                <button class="modal-btn primary" onclick="searchFriend()">搜索</button>
            </div>
        </div>
    </div>

    <!-- ===== 个人资料模态框 ===== -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div class="modal-title">
                👤 个人资料
            </div>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <div style="font-size: 13px; color: #cd853f; margin-bottom: 10px;">选择头像</div>
            </div>
            <div class="avatar-selector" id="avatarSelector">
                <!-- 头像选项由JS生成 -->
            </div>
            <input type="file" id="avatarUpload" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">

            <div class="form-group">
                <label class="form-label">昵称</label>
                <input type="text" class="form-input" id="profileNickname" maxlength="12">
            </div>

            <div class="location-section">
                <label class="form-label">我的位置</label>
                <button class="locate-btn" id="profileLocateBtn" onclick="getMyLocation()">
                    📡 获取当前位置（GPS定位）
                </button>
                <input type="text" class="form-input" id="profileLocation" placeholder="或手动输入位置名称">
                <div class="location-coords" id="profileCoords">
                    坐标：未获取
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">米粒余额</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="flex: 1; font-size: 20px; font-weight: bold; color: #d2691e;">
                        🌾 <span id="profileRice">0</span> 米粒
                    </div>
                    <button class="modal-btn primary" style="flex: none; padding: 8px 20px;" onclick="showRechargeModal()">充值</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="logout()">退出登录</button>
                <button class="modal-btn primary" onclick="saveProfile()">保存</button>
            </div>
        </div>
    </div>

    <!-- ===== 充值模态框 ===== -->
    <div class="modal" id="rechargeModal">
        <div class="modal-content">
            <div class="modal-title">
                💰 充值米粒
            </div>
            <p style="color: #cd853f; text-align: center; margin-bottom: 20px; font-size: 14px;">
                1元 = 100米粒 · 10米粒可飞一次
            </p>
            <div class="recharge-options">
                <div class="recharge-option" onclick="selectRecharge(this, 100)">
                    <div class="recharge-rice">🌾 100</div>
                    <div class="recharge-price">¥ 1.00</div>
                </div>
                <div class="recharge-option" onclick="selectRecharge(this, 500)">
                    <div class="recharge-rice">🌾 500</div>
                    <div class="recharge-price">¥ 5.00</div>
                </div>
                <div class="recharge-option selected" onclick="selectRecharge(this, 1000)">
                    <div class="recharge-rice">🌾 1000</div>
                    <div class="recharge-price">¥ 10.00</div>
                </div>
                <div class="recharge-option" onclick="selectRecharge(this, 5000)">
                    <div class="recharge-rice">🌾 5000</div>
                    <div class="recharge-price">¥ 50.00</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="hideRechargeModal()">取消</button>
                <button class="modal-btn primary" onclick="confirmRecharge()">确认充值</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 配置 ====================
        const AVATAR_OPTIONS = ['👤', '👨', '👩', '👴', '👵', '👦', '👧', '🧑', '👨‍🦰', '👩‍🦰', '👨‍🦱', '👩‍🦱', '🧔', '👸', '🤴', '🦸', '🧙', '🧚', '🐱', '🐶', '🐼', '🦊', '🐻', '🐨'];

        const BIRDS = {
            pigeon: { name: '鸽子', icon: '🕊️', speed: 60, desc: '温顺可靠的信使' },
            falcon: { name: '游隼', icon: '🦅', speed: 320, desc: '速度之王，极速投递' },
            swallow: { name: '燕子', icon: '🐦', speed: 110, desc: '灵巧敏捷的飞行家' },
            goose: { name: '大雁', icon: '🦢', speed: 80, desc: '耐力持久的迁徙者' },
            owl: { name: '猫头鹰', icon: '🦉', speed: 65, desc: '夜间也能送达' },
            sparrow: { name: '麻雀', icon: '🐤', speed: 50, desc: '小巧灵活的信使' }
        };

        const STORAGE_KEY = 'feige_users';
        const CURRENT_USER_KEY = 'feige_current_user';

        // ==================== 状态 ====================
        let currentUser = null;   // 当前登录用户
        let currentFriend = null; // 当前聊天好友
        let selectedRecharge = 1000;
        let selectedAvatar = '👤';

        // ==================== 存储工具 ====================
        function getUsers() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }

        function saveCurrentUser(phone) {
            localStorage.setItem(CURRENT_USER_KEY, phone);
        }

        function clearCurrentUser() {
            localStorage.removeItem(CURRENT_USER_KEY);
        }

        function getCurrentUserPhone() {
            return localStorage.getItem(CURRENT_USER_KEY);
        }

        // 更新当前用户数据到存储
        function updateCurrentUser() {
            if (!currentUser) return;
            const users = getUsers();
            users[currentUser.phone] = currentUser;
            saveUsers(users);
        }

        // ==================== 认证 ====================
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function doRegister() {
            const phone = document.getElementById('registerPhone').value.trim();
            const nickname = document.getElementById('registerNickname').value.trim();
            const password = document.getElementById('registerPassword').value;
            const password2 = document.getElementById('registerPassword2').value;

            // 验证
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号');
                return;
            }
            if (!nickname) {
                showToast('请输入昵称');
                return;
            }
            if (password.length < 6) {
                showToast('密码至少6位');
                return;
            }
            if (password !== password2) {
                showToast('两次密码不一致');
                return;
            }

            const users = getUsers();
            if (users[phone]) {
                showToast('该手机号已注册');
                return;
            }

            // 创建新用户
            users[phone] = {
                phone: phone,
                nickname: nickname,
                password: password,
                avatar: AVATAR_OPTIONS[Math.floor(Math.random() * 6)],
                rice: 500, // 注册赠送500米粒
                location: '',
                lat: null,
                lng: null,
                friends: [],
                messages: {} // { friendPhone: [ {from, to, text, bird, timestamp, status} ] }
            };
            saveUsers(users);

            showToast('注册成功！赠送500米粒 🌾');
            switchAuthTab('login');
            document.getElementById('loginPhone').value = phone;
        }

        function doLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号');
                return;
            }
            if (!password) {
                showToast('请输入密码');
                return;
            }

            const users = getUsers();
            const user = users[phone];

            if (!user) {
                showToast('该手机号未注册');
                return;
            }
            if (user.password !== password) {
                showToast('密码错误');
                return;
            }

            // 登录成功
            currentUser = user;
            saveCurrentUser(phone);
            enterApp();
            showToast('登录成功！');
        }

        function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            currentUser = null;
            currentFriend = null;
            clearCurrentUser();
            hideProfileModal();
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authPage').classList.remove('hidden');
            showToast('已退出登录');
        }

        // 自动登录
        function autoLogin() {
            const phone = getCurrentUserPhone();
            if (phone) {
                const users = getUsers();
                if (users[phone]) {
                    currentUser = users[phone];
                    enterApp();
                    return true;
                }
            }
            return false;
        }

        // ==================== 进入应用 ====================
        function enterApp() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            
            updateSidebar();
            renderFriendList();
            
            // 重置聊天区
            currentFriend = null;
            showEmptyChat();
        }

        function updateSidebar() {
            document.getElementById('sidebarAvatar').innerHTML = renderAvatarElement(currentUser.avatar);
            document.getElementById('sidebarNickname').textContent = currentUser.nickname;
            document.getElementById('sidebarPhone').textContent = currentUser.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
            document.getElementById('sidebarRice').textContent = '🌾 ' + currentUser.rice;
        }

        // ==================== 好友列表 ====================
        function renderFriendList(filter = '') {
            const listEl = document.getElementById('friendList');
            const friends = currentUser.friends || [];
            const users = getUsers();
            
            if (friends.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-friends">
                        <div class="empty-friends-icon">🕊️</div>
                        <div>还没有好友</div>
                        <div style="font-size: 12px; margin-top: 5px; opacity: 0.7;">点击上方添加好友</div>
                    </div>
                `;
                return;
            }

            let filteredFriends = friends;
            if (filter) {
                filteredFriends = friends.filter(phone => {
                    const friend = users[phone];
                    return friend && (friend.nickname.includes(filter) || phone.includes(filter));
                });
            }

            listEl.innerHTML = filteredFriends.map(phone => {
                const friend = users[phone];
                if (!friend) return '';
                
                const msgs = currentUser.messages[phone] || [];
                const lastMsg = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                const lastText = lastMsg ? (lastMsg.from === currentUser.phone ? '我：' : '') + lastMsg.text : '暂无消息';

                return `
                    <div class="friend-item ${currentFriend && currentFriend.phone === phone ? 'active' : ''}" 
                         onclick="openChat('${phone}')">
                        <div class="friend-avatar">${renderAvatarElement(friend.avatar)}</div>
                        <div class="friend-info">
                            <div class="friend-name">${escapeHtml(friend.nickname)}</div>
                            <div class="friend-last-msg">${escapeHtml(lastText.substring(0, 20))}</div>
                            <div class="friend-location">📍 ${friend.location || '未知位置'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterFriends() {
            const keyword = document.getElementById('friendSearch').value.trim();
            renderFriendList(keyword);
        }

        // ==================== 添加好友 ====================
        function showAddFriendModal() {
            document.getElementById('addFriendPhone').value = '';
            document.getElementById('searchResultArea').innerHTML = '';
            document.getElementById('addFriendModal').classList.add('active');
        }

        function hideAddFriendModal() {
            document.getElementById('addFriendModal').classList.remove('active');
        }

        function searchFriend() {
            const phone = document.getElementById('addFriendPhone').value.trim();
            const resultArea = document.getElementById('searchResultArea');

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号');
                return;
            }

            if (phone === currentUser.phone) {
                resultArea.innerHTML = `
                    <div class="search-no-result">
                        不能添加自己为好友
                    </div>
                `;
                return;
            }

            const users = getUsers();
            const friend = users[phone];

            if (!friend) {
                resultArea.innerHTML = `
                    <div class="search-no-result">
                        🔍 未找到该用户<br>
                        <span style="font-size: 12px; opacity: 0.7;">请确认手机号是否正确</span>
                    </div>
                `;
                return;
            }

            if (currentUser.friends.includes(phone)) {
                resultArea.innerHTML = `
                    <div class="search-result">
                        <div class="search-result-avatar">${renderAvatarElement(friend.avatar)}</div>
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(friend.nickname)}</div>
                            <div class="search-result-phone">${phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2')}</div>
                        </div>
                        <span style="color: #27ae60; font-size: 13px;">已是好友</span>
                    </div>
                `;
                return;
            }

            resultArea.innerHTML = `
                <div class="search-result">
                    <div class="search-result-avatar">${renderAvatarElement(friend.avatar)}</div>
                    <div class="search-result-info">
                        <div class="search-result-name">${escapeHtml(friend.nickname)}</div>
                        <div class="search-result-phone">${phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2')}</div>
                    </div>
                </div>
                <button class="modal-btn primary" style="width: 100%;" onclick="addFriend('${phone}')">
                    ➕ 添加好友
                </button>
            `;
        }

        function addFriend(friendPhone) {
            if (!currentUser.friends.includes(friendPhone)) {
                currentUser.friends.push(friendPhone);
                
                // 同时给对方也添加好友（双向）
                const users = getUsers();
                if (users[friendPhone]) {
                    if (!users[friendPhone].friends.includes(currentUser.phone)) {
                        users[friendPhone].friends.push(currentUser.phone);
                    }
                    // 给对方发一条系统消息
                    if (!users[friendPhone].messages[currentUser.phone]) {
                        users[friendPhone].messages[currentUser.phone] = [];
                    }
                    users[friendPhone].messages[currentUser.phone].push({
                        from: 'system',
                        to: friendPhone,
                        text: `你们已经是好友啦，快来发第一封信吧！`,
                        bird: 'pigeon',
                        timestamp: Date.now(),
                        status: 'delivered'
                    });
                    saveUsers(users);
                }

                // 给自己也加一条系统消息
                if (!currentUser.messages[friendPhone]) {
                    currentUser.messages[friendPhone] = [];
                }
                currentUser.messages[friendPhone].push({
                    from: 'system',
                    to: currentUser.phone,
                    text: `你们已经是好友啦，快来发第一封信吧！`,
                    bird: 'pigeon',
                    timestamp: Date.now(),
                    status: 'delivered'
                });

                updateCurrentUser();
                renderFriendList();
                hideAddFriendModal();
                showToast('添加好友成功！');
                openChat(friendPhone);
            }
        }

        // ==================== 聊天 ====================
        function showEmptyChat() {
            document.getElementById('emptyChat').classList.remove('hidden');
            document.getElementById('chatHeader').classList.add('hidden');
            document.getElementById('chatMessages').classList.add('hidden');
            document.getElementById('chatInputArea').classList.add('hidden');
        }

        function openChat(friendPhone) {
            const users = getUsers();
            const friend = users[friendPhone];
            if (!friend) {
                showToast('好友不存在');
                return;
            }

            currentFriend = friend;
            
            // 显示聊天区域
            document.getElementById('emptyChat').classList.add('hidden');
            document.getElementById('chatHeader').classList.remove('hidden');
            document.getElementById('chatMessages').classList.remove('hidden');
            document.getElementById('chatInputArea').classList.remove('hidden');

            // 更新头部信息
            document.getElementById('chatAvatar').innerHTML = renderAvatarElement(friend.avatar);
            document.getElementById('chatName').textContent = friend.nickname;
            document.getElementById('chatLocation').textContent = friend.location || '未知位置';
            
            // 计算距离
            updateDistanceDisplay();

            // 渲染消息
            renderMessages();
            
            // 更新好友列表高亮
            renderFriendList(document.getElementById('friendSearch').value.trim());
        }

        function updateDistanceDisplay() {
            const distance = calculateDistanceWithFriend();
            document.getElementById('chatDistance').textContent = distance + ' km';
            updateBirdInfo();
        }

        function calculateDistanceWithFriend() {
            if (!currentUser || !currentFriend) return '--';
            if (currentUser.lat == null || currentUser.lng == null || 
                currentFriend.lat == null || currentFriend.lng == null) {
                return '--';
            }
            return calculateHaversineDistance(
                currentUser.lat, currentUser.lng,
                currentFriend.lat, currentFriend.lng
            );
        }

        // Haversine 公式计算两点距离（公里）
        function calculateHaversineDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function updateBirdInfo() {
            const birdType = document.getElementById('birdSelect').value;
            const bird = BIRDS[birdType];
            const distance = calculateDistanceWithFriend();
            
            if (distance === '--' || isNaN(distance)) {
                document.getElementById('chatBirdInfo').textContent = '设置位置后可查看飞行时间';
                document.getElementById('costDisplay').textContent = '10 米粒';
            } else {
                const flyTime = formatFlyTime(bird.speed, distance);
                document.getElementById('chatBirdInfo').textContent = `${bird.icon} ${bird.name} · 预计飞行 ${flyTime}`;
                document.getElementById('costDisplay').textContent = '10 米粒';
            }
        }

        function formatFlyTime(speed, distance) {
            const hours = distance / speed;
            if (hours < 1) {
                const minutes = Math.round(hours * 60);
                return minutes + ' 分钟';
            } else if (hours < 24) {
                return hours.toFixed(1) + ' 小时';
            } else {
                const days = (hours / 24).toFixed(1);
                return days + ' 天';
            }
        }

        function calculateFlyDelay(speed, distance) {
            if (isNaN(distance) || distance === '--') return 3000;
            const baseDelay = (distance / speed) * 1000;
            return Math.min(Math.max(baseDelay * 2, 1500), 10000);
        }

        function renderMessages() {
            const msgEl = document.getElementById('chatMessages');
            const msgs = currentUser.messages[currentFriend.phone] || [];
            
            msgEl.innerHTML = msgs.map(msg => {
                if (msg.from === 'system') {
                    return `
                        <div style="align-self: center; background: rgba(210, 105, 30, 0.1); padding: 6px 15px; border-radius: 15px; font-size: 12px; color: #cd853f;">
                            ${escapeHtml(msg.text)}
                        </div>
                    `;
                }
                
                const isSent = msg.from === currentUser.phone;
                const bird = BIRDS[msg.bird] || BIRDS.pigeon;
                const time = new Date(msg.timestamp);
                const timeStr = time.getHours().toString().padStart(2, '0') + ':' + 
                               time.getMinutes().toString().padStart(2, '0');

                let statusText = '';
                if (msg.status === 'flying') {
                    statusText = '飞行中...';
                } else if (msg.status === 'delivered') {
                    statusText = '已送达';
                }

                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div class="message-bird">${bird.icon} ${bird.name}${isSent ? ' · ' + statusText : ''}</div>
                        ${escapeHtml(msg.text)}
                        <div class="message-time">${timeStr}</div>
                    </div>
                `;
            }).join('');

            msgEl.scrollTop = msgEl.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const birdType = document.getElementById('birdSelect').value;

            if (!text) {
                showToast('请先写点什么吧~');
                return;
            }

            if (!currentFriend) {
                showToast('请先选择好友');
                return;
            }

            if (currentUser.rice < 10) {
                showToast('米粒不足，请先充值！');
                showRechargeModal();
                return;
            }

            // 扣除米粒
            currentUser.rice -= 10;
            updateSidebar();

            const bird = BIRDS[birdType];
            const timestamp = Date.now();
            const distance = calculateDistanceWithFriend();

            // 添加到自己的消息（飞行中状态）
            const msg = {
                from: currentUser.phone,
                to: currentFriend.phone,
                text: text,
                bird: birdType,
                timestamp: timestamp,
                status: 'flying'
            };

            if (!currentUser.messages[currentFriend.phone]) {
                currentUser.messages[currentFriend.phone] = [];
            }
            currentUser.messages[currentFriend.phone].push(msg);

            input.value = '';
            renderMessages();

            // 计算飞行延迟
            const delay = calculateFlyDelay(bird.speed, distance === '--' ? 1000 : distance);

            // 模拟送达
            setTimeout(() => {
                // 更新自己这边的消息状态
                const myMsgs = currentUser.messages[currentFriend.phone];
                const myMsg = myMsgs.find(m => m.timestamp === timestamp);
                if (myMsg) {
                    myMsg.status = 'delivered';
                }

                // 给对方也发送消息
                const users = getUsers();
                const friendData = users[currentFriend.phone];
                if (friendData) {
                    if (!friendData.messages[currentUser.phone]) {
                        friendData.messages[currentUser.phone] = [];
                    }
                    friendData.messages[currentUser.phone].push({
                        from: currentUser.phone,
                        to: currentFriend.phone,
                        text: text,
                        bird: birdType,
                        timestamp: timestamp,
                        status: 'delivered'
                    });
                    saveUsers(users);
                }

                updateCurrentUser();
                renderMessages();
                renderFriendList(document.getElementById('friendSearch').value.trim());
                showToast(`${bird.name}已将消息送达！`);
            }, delay);
        }

        function refreshDistance() {
            // 重新获取双方位置计算距离
            updateDistanceDisplay();
            showToast('距离已更新');
        }

        // ==================== 个人资料 ====================
        function showProfileModal() {
            selectedAvatar = currentUser.avatar;
            document.getElementById('profileNickname').value = currentUser.nickname;
            document.getElementById('profileLocation').value = currentUser.location || '';
            document.getElementById('profileRice').textContent = currentUser.rice;
            
            if (currentUser.lat != null && currentUser.lng != null) {
                document.getElementById('profileCoords').textContent = 
                    `坐标：${currentUser.lat.toFixed(4)}°N, ${currentUser.lng.toFixed(4)}°E`;
            } else {
                document.getElementById('profileCoords').textContent = '坐标：未获取';
            }
            
            renderAvatarSelector();
            document.getElementById('profileModal').classList.add('active');
        }

        function hideProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        function isImageAvatar(avatar) {
            return avatar && avatar.startsWith && avatar.startsWith('data:image');
        }

        function renderAvatarElement(avatar, size = 'normal') {
            if (isImageAvatar(avatar)) {
                return `<img src="${avatar}" class="avatar-image" alt="头像">`;
            }
            return avatar || '👤';
        }

        function renderAvatarSelector() {
            const selector = document.getElementById('avatarSelector');
            selector.innerHTML = '';
            
            // 添加上传按钮
            const uploadDiv = document.createElement('div');
            uploadDiv.className = 'avatar-option upload-option';
            uploadDiv.textContent = '📷';
            uploadDiv.title = '从相册选择照片';
            uploadDiv.onclick = () => {
                document.getElementById('avatarUpload').click();
            };
            selector.appendChild(uploadDiv);

            // 如果当前是自定义图片头像，显示在第一个
            if (isImageAvatar(selectedAvatar)) {
                const div = document.createElement('div');
                div.className = 'avatar-option selected';
                div.innerHTML = `<img src="${selectedAvatar}" alt="头像" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                div.onclick = () => {
                    // 取消选择，用默认emoji
                    selectedAvatar = AVATAR_OPTIONS[0];
                    renderAvatarSelector();
                };
                selector.appendChild(div);
            }
            
            AVATAR_OPTIONS.forEach(avatar => {
                const div = document.createElement('div');
                div.className = 'avatar-option' + (avatar === selectedAvatar ? ' selected' : '');
                div.textContent = avatar;
                div.onclick = () => {
                    selectedAvatar = avatar;
                    renderAvatarSelector();
                };
                selector.appendChild(div);
            });
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 检查文件类型
            if (!file.type.startsWith('image/')) {
                showToast('请选择图片文件');
                return;
            }

            // 检查文件大小（最大2MB）
            if (file.size > 2 * 1024 * 1024) {
                showToast('图片不能超过2MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // 压缩图片到合适尺寸
                    const canvas = document.createElement('canvas');
                    const maxSize = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxSize) {
                            height = height * maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width = width * maxSize / height;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 转为base64
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    selectedAvatar = compressedDataUrl;
                    renderAvatarSelector();
                    showToast('头像设置成功！');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            
            // 重置input，允许重复选择同一文件
            event.target.value = '';
        }

        function getMyLocation() {
            if (!navigator.geolocation) {
                showToast('您的浏览器不支持地理定位');
                return;
            }

            const btn = document.getElementById('profileLocateBtn');
            btn.classList.add('loading');
            btn.textContent = '📡 定位中...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // 临时保存，确认后再保存
                    currentUser.tempLat = lat;
                    currentUser.tempLng = lng;

                    document.getElementById('profileCoords').textContent = 
                        `坐标：${lat.toFixed(6)}°N, ${lng.toFixed(6)}°E (精度约${Math.round(accuracy)}米)`;
                    
                    if (!document.getElementById('profileLocation').value) {
                        document.getElementById('profileLocation').value = '当前位置';
                    }

                    btn.classList.remove('loading');
                    btn.textContent = '📡 获取当前位置（GPS定位）';
                    showToast(`定位成功！精度约${Math.round(accuracy)}米`);
                },
                (error) => {
                    let errorMsg = '定位失败';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = '您拒绝了定位请求';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = '位置信息不可用';
                            break;
                        case error.TIMEOUT:
                            errorMsg = '定位超时';
                            break;
                    }
                    showToast(errorMsg);
                    btn.classList.remove('loading');
                    btn.textContent = '📡 获取当前位置（GPS定位）';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function saveProfile() {
            const nickname = document.getElementById('profileNickname').value.trim();
            const location = document.getElementById('profileLocation').value.trim();

            if (!nickname) {
                showToast('请输入昵称');
                return;
            }

            currentUser.nickname = nickname;
            currentUser.avatar = selectedAvatar;
            currentUser.location = location;

            // 如果有临时坐标，保存
            if (currentUser.tempLat != null) {
                currentUser.lat = currentUser.tempLat;
                currentUser.lng = currentUser.tempLng;
                delete currentUser.tempLat;
                delete currentUser.tempLng;
            }

            updateCurrentUser();
            updateSidebar();
            renderFriendList(document.getElementById('friendSearch').value.trim());
            
            // 如果当前在聊天，更新距离
            if (currentFriend) {
                updateDistanceDisplay();
            }

            hideProfileModal();
            showToast('资料保存成功！');
        }

        // ==================== 充值 ====================
        function showRechargeModal() {
            document.getElementById('rechargeModal').classList.add('active');
        }

        function hideRechargeModal() {
            document.getElementById('rechargeModal').classList.remove('active');
        }

        function selectRecharge(element, amount) {
            document.querySelectorAll('.recharge-option').forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedRecharge = amount;
        }

        function confirmRecharge() {
            currentUser.rice += selectedRecharge;
            updateCurrentUser();
            updateSidebar();
            document.getElementById('profileRice').textContent = currentUser.rice;
            hideRechargeModal();
            showToast(`充值成功！获得 ${selectedRecharge} 米粒 🌾`);
        }

        // ==================== 工具函数 ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ==================== 事件绑定 ====================
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 模态框点击外部关闭
        document.getElementById('addFriendModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddFriendModal();
        });

        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) hideProfileModal();
        });

        document.getElementById('rechargeModal').addEventListener('click', function(e) {
            if (e.target === this) hideRechargeModal();
        });

        // ==================== 初始化 ====================
        function init() {
            // 尝试自动登录
            if (!autoLogin()) {
                document.getElementById('authPage').classList.remove('hidden');
            }
        }

        init();

        // ===== PWA: 注册 Service Worker =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('service-worker.js')
                    .then(function(registration) {
                        console.log('飞鸽传书 PWA 注册成功:', registration.scope);
                        
                        // 检测到新版本时提示更新
                        registration.addEventListener('updatefound', function() {
                            const installingWorker = registration.installing;
                            installingWorker.addEventListener('statechange', function() {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (confirm('飞鸽传书有新版本，是否立即更新？')) {
                                        installingWorker.postMessage('SKIP_WAITING');
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker 注册失败:', error);
                    });
                
                // 安装 PWA 提示
                let deferredPrompt;
                window.addEventListener('beforeinstallprompt', function(e) {
                    e.preventDefault();
                    deferredPrompt = e;
                    // 可以在这里显示自定义的安装按钮
                    console.log('可以安装飞鸽传书到桌面了');
                });
            });
        }
    </script>
</body>
